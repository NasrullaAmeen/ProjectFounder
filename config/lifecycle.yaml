# lifecycle.yaml
#
# Defines the project lifecycle states (IDEA -> ... -> ARCHIVED) and valid
# transitions used by the Lifecycle Engine (ProjectFounder-idea.md § 25).
#
# Status: Phase 0 (§140) — the state machine below is real data; no engine
# enforces these transitions yet. An agent moving a project between states
# checks this file directly rather than calling a validator.

version: 0.1
status: draft

initial_state: IDEA

states:
  - IDEA
  - CAPTURED
  - CLASSIFIED
  - EXPLORING   # § 163.12 — non-CREATE intent only, between CLASSIFIED and DISCOVERY
  - DISCOVERY
  - SCOPED      # § 163.14 — Gap Analysis/Feature Discovery/Requirements done, an alternate branch from DISCOVERY alongside RESEARCHING
  - RESEARCHING
  - DESIGNING
  - SPECIFYING
  - VALIDATING
  - READY
  - BUILDING
  - TESTING
  - BETA
  - PRODUCTION
  - OPERATING
  - EVOLVING
  - ARCHIVED

# Baseline transitions, as diagrammed in § 25, plus:
# - EVOLVING -> RESEARCHING (§ 163.9, matching § 124's Continuous Intelligence Loop)
# - CLASSIFIED -> EXPLORING / EXPLORING -> DISCOVERY (§ 163.12): CLASSIFIED's
#   two legal next states are chosen by the project's `intent` field — a
#   non-CREATE intent goes to EXPLORING first, CREATE skips straight to
#   DISCOVERY.
# - DISCOVERY -> SCOPED / SCOPED -> RESEARCHING (§ 163.14): DISCOVERY's two
#   legal next states are chosen by which action runs next (workflows/requirements.md
#   vs. a future Research workflow), not a PROJECT.yaml field. Whether
#   RESEARCHING -> DESIGNING should require SCOPED's output (REQUIREMENTS.md)
#   first is unresolved — see docs/OPEN-QUESTIONS.md.
#   Other loop-backs (e.g. a failed VALIDATING returning to SPECIFYING)
#   aren't diagrammed anywhere in the spec, so none are encoded here — see
#   docs/OPEN-QUESTIONS.md Q8 rather than inventing transition rules the
#   spec doesn't state.
transitions:
  IDEA: [CAPTURED]
  CAPTURED: [CLASSIFIED]
  CLASSIFIED: [EXPLORING, DISCOVERY]   # § 163.12: EXPLORING if intent != CREATE, else DISCOVERY
  EXPLORING: [DISCOVERY]
  DISCOVERY: [RESEARCHING, SCOPED]     # § 163.14: SCOPED if Gap Analysis/Feature Discovery/Requirements run first
  SCOPED: [RESEARCHING]                # § 163.14
  RESEARCHING: [DESIGNING]
  DESIGNING: [SPECIFYING]
  SPECIFYING: [VALIDATING]
  VALIDATING: [READY]
  READY: [BUILDING]
  BUILDING: [TESTING]
  TESTING: [BETA]
  BETA: [PRODUCTION]
  PRODUCTION: [OPERATING]
  OPERATING: [EVOLVING]
  EVOLVING: [RESEARCHING, ARCHIVED]   # § 163.9: RESEARCHING = reassess, ARCHIVED = retire
  ARCHIVED: []
